<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Natur - Pixlpaule Naturfotografie</title>

    <style>
        body {
            background-color: darkslategray;
            background-image: linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)), url("bilder/mara.jpeg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #d6c7a1;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            font-family: Arial, sans-serif;
            line-height: 1.6;
        }

        h1, h2, h3, h4 {
            color: rgb(80, 130, 40);
            text-shadow: 2px 2px 4px black;
        }

        p {
            color: #d6c7a1;
            text-shadow: 2px 2px 4px black;
        }

        a {
            color: #d6c7a1;
            text-shadow: 2px 2px 4px black;
        }

        button {
            font-size: 18px;
            padding: 10px;
            margin: 5px;
            background-color: #d6c7a1;
            color: #000;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .inhalt {
            background-color: rgba(30, 40, 30, 0.82);
            padding: 25px;
            margin-top: 25px;
            border-radius: 8px;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        @media (max-width: 600px) {
            body {
                font-size: 17px;
                margin: 0;
                padding: 15px;
                background-size: auto 100vh;
                background-position: 75% center;
                background-attachment: fixed;
                overflow-x: hidden;
            }

            h2 {
                font-size: 24px;
            }

            p {
                font-size: 17px;
                line-height: 1.5;
            }

            a {
                display: inline-block;
            }

            button {
                font-size: 16px;
                padding: 8px 12px;
                margin: 4px 2px;
            }

            img {
                max-width: 100%;
                height: auto;
            }
        }
    </style>
</head>
